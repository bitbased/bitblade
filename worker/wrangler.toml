name = "bitblade"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Production hostname (zone bitbased.net must be on this Cloudflare account)
routes = [{ pattern = "bitblade.bitbased.net", custom_domain = true }]

[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/room/*", "/health", "/api/*", "/join/*", "/mm", "/admin", "/admin/*"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "DIR"
class_name = "Directory"

[[durable_objects.bindings]]
name = "QUEUE"
class_name = "Queue"

[[durable_objects.bindings]]
name = "ADMIN"
class_name = "Admin"

# The admin switches, bans and whitelist, kept for good (portable to another worker / app; readable and fixable from
# the dashboard or `wrangler kv` even if the admin page is down). Create it once:
#   bun x wrangler kv namespace create ADMIN_KV      → put the id it prints here
[[kv_namespaces]]
binding = "ADMIN_KV"
id = "3f4ba8f56c1b45158e9668d287daa4eb"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Directory"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Queue"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["Admin"]

# The admin page password is a secret, never in this file:
#   bun x wrangler secret put ADMIN_TOKEN        (production)
#   worker/.dev.vars: ADMIN_TOKEN=...            (wrangler dev — git-ignored)
#   worker/.prod.vars: ADMIN_TOKEN=...           (git-ignored) → bun x wrangler secret bulk .prod.vars
