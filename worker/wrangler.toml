name = "bitblade"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Production hostname (zone bitbased.net must be on this Cloudflare account)
routes = [{ pattern = "bitblade.bitbased.net", custom_domain = true }]

[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/room/*", "/health"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
