name = "bitblade"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# No custom domain here: a plain deploy goes to the free https://bitblade.<your-account>.workers.dev.
# For your own domain (and the optional KV below) put them in worker/deploy.env and deploy with `bun run worker:deploy`
# (scripts/deploy.ts) — see the README's Self-hosting section.

[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/room/*", "/health", "/api/*", "/join/*", "/mm", "/admin", "/admin/*"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "DIR"
class_name = "Directory"

[[durable_objects.bindings]]
name = "QUEUE"
class_name = "Queue"

[[durable_objects.bindings]]
name = "ADMIN"
class_name = "Admin"

# Optional KV (ADMIN_KV): a second copy of the admin switches, bans and whitelist that outlives the worker (portable
# to another worker; readable and fixable from the dashboard or `wrangler kv` even if the admin page is down). Without
# it they're kept in the Admin Durable Object, which is fine. To use it: `bun x wrangler kv namespace create ADMIN_KV`
# and put the id in worker/deploy.env as ADMIN_KV_ID.

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Directory"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Queue"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["Admin"]

# The admin page password is a secret, never in this file:
#   bun x wrangler secret put ADMIN_TOKEN        (production)
#   worker/.dev.vars: ADMIN_TOKEN=...            (wrangler dev — git-ignored)
#   worker/.prod.vars: ADMIN_TOKEN=...           (git-ignored) → bun x wrangler secret bulk .prod.vars
