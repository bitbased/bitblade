<!doctype html><html><head>
<!-- 2x2 share image for X / Twitter (16:9) → docs/social/share-2x2.png. Render: bun run social --><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1600px; height: 900px; overflow: hidden; background: #05060c; }
  .grid { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 10px; padding: 10px; box-sizing: border-box; }
  .t { position: relative; overflow: hidden; border-radius: 16px; box-shadow: 0 0 0 1px rgba(60,242,255,.18) inset; }
  .t img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .t.music img { object-position: 50% 30%; }
  .lab { position: absolute; font: 900 25px Orbitron, sans-serif; letter-spacing: .1em; color: #fff; padding: 9px 18px 8px; border-radius: 10px;
         background: rgba(5,6,12,.78); border: 2px solid var(--c); box-shadow: 0 0 22px color-mix(in srgb, var(--c) 45%, transparent); text-shadow: 0 0 12px var(--c); }
  .tl .lab, .bl .lab { left: 18px; } .tr .lab, .br .lab { right: 18px; }
  .tl .lab, .tr .lab { top: 18px; } .bl .lab, .br .lab { bottom: 18px; }
  /* (keep the labels off the game's own HUD: top corners of the top row have the score / pause) */
  .tr .lab { top: 62px; } /* (under the pause button) */
  .badge { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 22px; padding: 18px 34px 18px 20px;
           background: radial-gradient(ellipse at 30% 30%, #22155e, #0b0922 70%); border-radius: 26px; border: 2px solid rgba(60,242,255,.55);
           box-shadow: 0 0 0 10px #05060c, 0 0 60px rgba(60,242,255,.35); }
  .badge img { width: 112px; height: 112px; }
  .name { font: 900 64px/1 Orbitron, sans-serif; letter-spacing: .03em; background: linear-gradient(180deg, #fff 8%, #3cf2ff 55%, #ff3db4 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin-top: 8px; font: 700 21px Orbitron, sans-serif; color: #ffd23a; letter-spacing: .22em; }
  .url { margin-top: 8px; font: 700 23px Rajdhani, sans-serif; color: #b9c4e8; letter-spacing: .02em; }
  .url b { color: #3cf2ff; font-family: Orbitron, sans-serif; font-size: 20px; }
</style></head><body>
<div class="grid">
  <div class="t tl"><img src="../screens/battle-closeup.jpg"><div class="lab" style="--c:#ff7b1c">BATTLE</div></div>
  <div class="t tr"><img src="../screens/race.jpg"><div class="lab" style="--c:#ffd23a">GRAND PRIX</div></div>
  <div class="t bl"><img src="../screens/pinball.jpg"><div class="lab" style="--c:#ff3db4">PINBALL</div></div>
  <div class="t br music"><img src="../screens/music-studio.jpg"><div class="lab" style="--c:#3cf2ff">MUSIC STUDIO</div></div>
</div>
<div class="badge"><img src="../../public/icon.svg">
  <div><div class="name">BITBLADE</div><div class="sub">LET IT RIP</div><div class="url">free in your browser · <b>bitblade.bitbased.net</b></div></div></div>
</body></html>
